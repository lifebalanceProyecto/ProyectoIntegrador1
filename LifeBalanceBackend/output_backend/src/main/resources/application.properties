spring.application.name=LifeBalance

# MySQL - XAMPP
spring.datasource.url=jdbc:mysql://localhost:3307/lifebalance_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# update: crea tablas si no existen, modifica columnas si cambian
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

server.port=8080
